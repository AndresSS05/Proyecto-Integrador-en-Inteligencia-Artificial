[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spider-uees-evaluation"
version = "0.1.0"
description = "Repositorio reproducible para evaluación de modelos de IA sobre Spider"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Joel David Cabrera Parrales"},
  {name = "Aníbal Andrés Sánchez Arévalo"}
]
dependencies = [
  "datasets>=2.18.0",
  "joblib>=1.3.0",
  "lightgbm>=4.0.0",
  "matplotlib>=3.8.0",
  "nltk>=3.8.1",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.4.0",
  "seaborn>=0.13.0",
  "sqlparse>=0.5.0",
  "tqdm>=4.66.0",
  "xgboost>=2.0.0"
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
